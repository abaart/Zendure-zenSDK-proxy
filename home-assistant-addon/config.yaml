name: Zendure zenSDK Proxy
version: "0.1.0"
slug: zendure_zensdk_proxy
description: Python Zendure zenSDK proxy for multiple Zendure devices
url: "https://github.com/gast777/Zendure-zenSDK-proxy"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
host_network: true
ports:
  1880/tcp: 1880
ports_description:
  1880/tcp: Zendure proxy HTTP API
map:
  - addon_config:rw
options:
  log_level: INFO
  timeout_seconds: 5
  cache_ttl_seconds: 60
  devices:
    - name: zendure1
      host: 192.168.x.x
    - name: zendure2
      host: 192.168.x.y
schema:
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  timeout_seconds: float
  cache_ttl_seconds: float
  devices:
    - name: str
      host: str

