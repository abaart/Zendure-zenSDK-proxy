                  - entity: sensor.zendure_2400_ac_serienummer
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_vermogen_aansturing
              - entity: sensor.zendure_actief_device
                name: Actief Device
              - entity: sensor.zendure_1_laadpercentage
              - entity: sensor.zendure_2_laadpercentage
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2400_ac_serienummer
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_laadpercentage
              - entity: sensor.zendure_1_modus
              - entity: sensor.zendure_2_modus
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2400_ac_serienummer
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_modus
              - entity: sensor.zendure_1_relais_stand
              - entity: sensor.zendure_2_relais_stand
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2400_ac_serienummer
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_relais_stand
              - entity: sensor.zendure_1_soc_limiet_status
              - entity: sensor.zendure_2_soc_limiet_status
              - type: conditional
                conditions:
                  - entity: sensor.zendure_2400_ac_serienummer
                    state: 3x Zendure via PROXY
                row:
                  entity: sensor.zendure_3_soc_limiet_status
              - entity: sensor.zendure_1_opslagmodus
              - entity: sensor.zendure_2_opslagmodus
