automation:
- id: zendure_network_incident_notification
  alias: Zendure network incident notification
  mode: single
  description: Persistent timers; one notification per device per 24 hours. Change
    the thresholds in the monitor variable.
  triggers:
  - trigger: time_pattern
    minutes: /1
    seconds: '30'
  variables:
    notify_service: notify.mobile_app_your_phone
  actions:
  - repeat:
      for_each:
      - 1
      - 2
      - 3
      sequence:
      - variables:
          n: '{{ repeat.item }}'
          m: '{{ state_attr(''sensor.zendure_'' ~ repeat.item ~ ''_network_monitor'',
            ''monitor'') or {} }}'
          last_notification: '{{ states(''input_number.zendure_'' ~ repeat.item ~
            ''_network_last_notification'') | float(0) }}'
      - if:
        - condition: template
          value_template: '{{ (m.get(''connection_alert'', false) or m.get(''wifi_alert'',
            false)) and as_timestamp(now()) - last_notification | float(0) >= 86400
            }}'
        then:
        - variables:
            message: "Zendure {{ n }}: {% if m.connection_alert %}al meer dan {{ m.connection_hours\
              \ }} uur veel verbindingsproblemen ({{ m.errors_last_hour | round(0)\
              \ }} fouten in het laatste uur). {% endif %}{% if m.wifi_alert %}Wifi\
              \ wijkt al minstens {{ m.rssi_minutes }} minuten af: {{ m.rssi }} dBm\
              \ tegenover {{ m.wifi_reference | round(1) }} dBm vóór de afwijking.\
              \ {% endif %}Controleer het access point, wifi-bereik en de Zendure. "
        - action: input_number.set_value
          target:
            entity_id: '{{ ''input_number.zendure_'' ~ n ~ ''_network_last_notification''
              }}'
          data:
            value: '{{ as_timestamp(now()) | int }}'
        - action: persistent_notification.create
          data:
            notification_id: '{{ ''zendure_network_'' ~ n }}'
            title: Zendure verbindingsprobleem
            message: '{{ message }}'
        - action: '{{ notify_service }}'
          continue_on_error: true
          data:
            title: Zendure verbindingsprobleem
            message: '{{ message }}'
            data:
              tag: '{{ ''zendure_network_'' ~ n }}'
